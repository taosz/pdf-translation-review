name: PDF translation review copy
description: Create a side-by-side PDF for manual translation review on the runner
branding:
  icon: columns
  color: blue
inputs:
  original:
    description: Path to the original PDF in the checked-out workspace
    required: true
  translation:
    description: Path to the translated PDF in the checked-out workspace
    required: true
  output:
    description: New output file path; existing files are never overwritten
    required: false
    default: review.pdf
  source-start:
    description: First original page, numbered from one
    required: false
    default: '1'
  translation-start:
    description: First translated page, numbered from one
    required: false
    default: '1'
  pages:
    description: Number of page pairs; required when remaining counts differ
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Install pinned PDF dependency
      shell: bash
      run: python -m pip install --disable-pip-version-check 'pypdf==6.21.4'
    - name: Create review copy
      shell: bash
      env:
        REVIEW_ORIGINAL: ${{ inputs.original }}
        REVIEW_TRANSLATION: ${{ inputs.translation }}
        REVIEW_OUTPUT: ${{ inputs.output }}
        REVIEW_SOURCE_START: ${{ inputs.source-start }}
        REVIEW_TRANSLATION_START: ${{ inputs.translation-start }}
        REVIEW_PAGES: ${{ inputs.pages }}
        REVIEW_ACTION_PATH: ${{ github.action_path }}
      run: |
        args=("$REVIEW_ORIGINAL" "$REVIEW_TRANSLATION" -o "$REVIEW_OUTPUT" --source-start "$REVIEW_SOURCE_START" --translation-start "$REVIEW_TRANSLATION_START")
        if [[ -n "$REVIEW_PAGES" ]]; then args+=(--pages "$REVIEW_PAGES"); fi
        python "$REVIEW_ACTION_PATH/pdf_review.py" "${args[@]}"

